<!-- ===== TEMA BIRU + CATATAN + KALKULATOR ===== -->
<style>
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  --paper:#EAF4FF;--paper-line:#CFE3F8;--ink:#0B2A5B;--ink-soft:#4A6FA5;
  --gold:#1565C0;--green:#1F9D55;--green-bg:#DDF5E6;--red:#E5484D;--red-bg:#FDE7E8;
  --card:#FFFFFF;--shadow:rgba(21,101,192,0.18);
}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
header{background:linear-gradient(135deg,#0B3D91,#4FA3F7);border-radius:14px;padding:18px 18px 16px;}
header h1{color:#fff;}
header p{color:#E3F0FF;font-style:normal;}
.card{border-top:4px solid #4FA3F7;border-radius:12px;}
.nx-area{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--paper-line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:.95rem;margin-bottom:10px;resize:vertical;}
.nx-btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--gold);color:#fff;font-family:inherit;font-weight:600;font-size:.95rem;cursor:pointer;}
.nx-btn:active{opacity:.8;}
.nx-note{padding:12px;border:1px solid var(--paper-line);border-left:4px solid var(--gold);border-radius:8px;margin-bottom:10px;background:var(--paper);}
.nx-note .t{white-space:pre-wrap;word-break:break-word;}
.nx-note .m{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.75rem;color:var(--ink-soft);}
.nx-note .m button{background:none;border:none;color:var(--red);cursor:pointer;font-family:inherit;font-size:.8rem;padding:2px 4px;}
.calc-screen{background:#0B2A5B;color:#fff;border-radius:10px;padding:12px 14px;text-align:right;margin-bottom:12px;min-height:76px;}
.calc-expr{font-size:.9rem;color:#9CC7FF;min-height:1.2rem;word-break:break-all;}
.calc-res{font-size:2rem;font-weight:700;word-break:break-all;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.calc-grid button{padding:16px 0;border:none;border-radius:10px;font-family:inherit;font-size:1.15rem;font-weight:600;cursor:pointer;background:#DCEBFF;color:#0B2A5B;}
.calc-grid button.op{background:#4FA3F7;color:#fff;}
.calc-grid button.fn{background:#B9D8FF;}
.calc-grid button.eq{background:#0B3D91;color:#fff;}
.calc-grid button:active{opacity:.75;}
</style>
<script>
(function(){
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content','#0B3D91');
  var wrap=document.querySelector('.wrap');
  if(!wrap) return;

  /* ===== CATATAN ===== */
  var NOTES_KEY='buku-kas-harian:notes:v1';
  var notes=[];
  try{
    var raw=window.localStorage.getItem(NOTES_KEY);
    notes=raw?JSON.parse(raw):[];
    if(!Array.isArray(notes)) notes=[];
  }catch(e){ notes=[]; }
  function saveNotes(){
    try{ window.localStorage.setItem(NOTES_KEY,JSON.stringify(notes)); }catch(e){}
  }

  var nSec=document.createElement('section');
  nSec.className='card';
  nSec.innerHTML='<h2>Catatan</h2>'
    +'<textarea class="nx-area" id="nxText" placeholder="Tulis catatan..."></textarea>'
    +'<button type="button" class="nx-btn" id="nxAdd">Simpan catatan</button>'
    +'<div id="nxList" style="margin-top:14px;"></div>';
  wrap.appendChild(nSec);

  function renderNotes(){
    var list=document.getElementById('nxList');
    list.innerHTML='';
    if(!notes.length){
      var em=document.createElement('div');
      em.className='empty';
      em.textContent='Belum ada catatan.';
      list.appendChild(em);
      return;
    }
    notes.forEach(function(n){
      var box=document.createElement('div');
      box.className='nx-note';
      var t=document.createElement('div');
      t.className='t';
      t.textContent=n.text;
      var m=document.createElement('div');
      m.className='m';
      var d=document.createElement('span');
      d.textContent=new Date(n.ts).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      var del=document.createElement('button');
      del.type='button';
      del.textContent='Hapus';
      del.addEventListener('click',function(){
        notes=notes.filter(function(x){ return x.id!==n.id; });
        saveNotes();
        renderNotes();
      });
      m.appendChild(d);
      m.appendChild(del);
      box.appendChild(t);
      box.appendChild(m);
      list.appendChild(box);
    });
  }
  document.getElementById('nxAdd').addEventListener('click',function(){
    var ta=document.getElementById('nxText');
    var txt=ta.value.trim();
    if(!txt) return;
    notes.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),text:txt,ts:Date.now()});
    saveNotes();
    ta.value='';
    renderNotes();
  });
  renderNotes();

  /* ===== KALKULATOR ===== */
  var cSec=document.createElement('section');
  cSec.className='card';
  cSec.innerHTML='<h2>Kalkulator</h2>'
    +'<div class="calc-screen"><div class="calc-expr" id="calcExpr"></div><div class="calc-res" id="calcRes">0</div></div>'
    +'<div class="calc-grid" id="calcGrid"></div>';
  wrap.appendChild(cSec);

  var exprEl=document.getElementById('calcExpr');
  var resEl=document.getElementById('calcRes');
  var expr='';
  var justEval=false;

  function evaluate(s){
    s=s.replace(/[+−×÷]+$/,'');
    var t=s.match(/\d+\.?\d*|\.\d+|[+−×÷%]/g)||[];
    var i=0;
    function post(){
      var tok=t[i++];
      if(tok===undefined||isNaN(parseFloat(tok))) throw new Error('syn');
      var v=parseFloat(tok);
      while(t[i]==='%'){ i++; v=v/100; }
      return v;
    }
    function unary(){
      if(t[i]==='−'){ i++; return -unary(); }
      return post();
    }
    function term(){
      var v=unary();
      while(t[i]==='×'||t[i]==='÷'){
        var o=t[i++];
        var r=unary();
        if(o==='÷'){ if(r===0) throw new Error('div0'); v=v/r; }
        else v=v*r;
      }
      return v;
    }
    function add(){
      var v=term();
      while(t[i]==='+'||t[i]==='−'){
        var o=t[i++];
        var r=term();
        v=(o==='+')?v+r:v-r;
      }
      return v;
    }
    var out=add();
    if(i<t.length) throw new Error('syn');
    return out;
  }
  function round(v){ return Math.round(v*1e10)/1e10; }
  function fmt(v){ return round(v).toLocaleString('id-ID',{maximumFractionDigits:10}); }
  function refresh(){
    exprEl.textContent=expr;
    if(!expr){ resEl.textContent='0'; return; }
    try{ resEl.textContent=fmt(evaluate(expr)); }
    catch(e){ if(e.message==='div0') resEl.textContent='Tidak bisa ÷ 0'; }
  }
  function isOp(c){ return c!=='' && '+−×÷'.indexOf(c)>-1; }

  function press(k){
    var last=expr.charAt(expr.length-1);
    if(k==='C'){ expr=''; justEval=false; refresh(); return; }
    if(k==='⌫'){
      if(justEval){ expr=''; justEval=false; } else { expr=expr.slice(0,-1); }
      refresh(); return;
    }
    if(k==='='){
      if(!expr) return;
      try{
        var v=evaluate(expr);
        var old=expr;
        expr=String(round(v)).replace('-','−');
        justEval=true;
        exprEl.textContent=old+' =';
        resEl.textContent=fmt(v);
      }catch(e){
        resEl.textContent=(e.message==='div0')?'Tidak bisa ÷ 0':'Format salah';
      }
      return;
    }
    if(k==='00'||/^[0-9.]$/.test(k)){
      if(justEval){ expr=''; justEval=false; last=''; }
      if(last==='%') return;
      var seg=expr.split(/[+−×÷]/).pop();
      if(k==='.'){
        if(seg.indexOf('.')>-1) return;
        if(seg==='') k='0.';
      } else if(seg==='0'){
        expr=expr.slice(0,-1);
        if(k==='00') k='0';
      } else if(k==='00' && seg===''){
        k='0';
      }
      expr+=k;
      refresh(); return;
    }
    if(k==='%'){
      justEval=false;
      if(/[0-9%]$/.test(expr)) expr+='%';
      refresh(); return;
    }
    /* operator */
    justEval=false;
    if(expr===''){ if(k==='−') expr='−'; refresh(); return; }
    if(expr==='−') return;
    if(isOp(last)){
      if(k==='−' && (last==='×'||last==='÷')) expr+=k;
      else expr=expr.replace(/[+−×÷]+$/,'')+k;
    } else {
      expr+=k;
    }
    refresh();
  }

  var keys=[['C','fn'],['⌫','fn'],['%','fn'],['÷','op'],
            ['7',''],['8',''],['9',''],['×','op'],
            ['4',''],['5',''],['6',''],['−','op'],
            ['1',''],['2',''],['3',''],['+','op'],
            ['0',''],['.',''],['00',''],['=','eq']];
  var grid=document.getElementById('calcGrid');
  keys.forEach(function(k){
    var b=document.createElement('button');
    b.type='button';
    b.className=k[1];
    b.textContent=k[0];
    b.addEventListener('click',function(){ press(k[0]); });
    grid.appendChild(b);
  });
})();
                                   </script>
