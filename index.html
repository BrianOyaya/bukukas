<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buku Kas Harian</title>

<style>
:root{
  --paper:#EFEAE0;
  --paper-line:#DCD4C2;
  --ink:#26344A;
  --ink-soft:#667085;
  --gold:#B98A2E;
  --green:#3C7A5B;
  --green-bg:#E4EFE6;
  --red:#A6483A;
  --red-bg:#F3E3DF;
  --card:#FBF9F4;
  --white:#FFFFFF;
  --shadow:rgba(38,52,74,.12);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--card);
  border-bottom:1px solid var(--paper-line);
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header h1{
  font-size:20px;
}

.header-right{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:12px;
  background:var(--paper);
  color:var(--ink);
  font-size:20px;
  cursor:pointer;
}

/* ================= DRAWER ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:40;
  display:none;
}

.overlay.show{
  display:block;
}

.drawer{
  position:fixed;
  top:0;
  left:-280px;
  width:270px;
  height:100%;
  background:var(--card);
  z-index:50;
  padding:22px;
  transition:.25s;
  box-shadow:5px 0 20px rgba(0,0,0,.15);
}

.drawer.open{
  left:0;
}

.drawer h2{
  margin-bottom:25px;
}

.menu-btn{
  width:100%;
  padding:14px;
  border:none;
  background:none;
  text-align:left;
  font-size:16px;
  color:var(--ink);
  border-radius:10px;
  margin-bottom:5px;
  cursor:pointer;
}

.menu-btn:hover{
  background:var(--paper);
}

/* ================= MAIN ================= */

main{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

/* ================= CARD ================= */

.card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 15px var(--shadow);
}

.card-title{
  font-weight:bold;
  margin-bottom:12px;
}

/* ================= SALDO ================= */

.balance-card{
  text-align:center;
  padding:25px 18px;
}

.balance-label{
  color:var(--ink-soft);
  font-size:14px;
}

.balance{
  font-size:32px;
  font-weight:bold;
  margin:8px 0 20px;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.summary-box{
  padding:12px;
  border-radius:12px;
}

.income{
  background:var(--green-bg);
  color:var(--green);
}

.expense{
  background:var(--red-bg);
  color:var(--red);
}

.summary-label{
  font-size:12px;
}

.summary-value{
  font-weight:bold;
  margin-top:4px;
}

/* ================= NOMINAL ================= */

.coin-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.coin{
  border:none;
  background:var(--paper);
  color:var(--ink);
  border-radius:12px;
  padding:14px 5px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.coin:active{
  transform:scale(.95);
  background:#ddd5c5;
}

.tally{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  margin:15px 0;
}

.custom-input{
  width:100%;
  padding:13px;
  border:1px solid var(--paper-line);
  border-radius:12px;
  background:white;
  font-size:16px;
  outline:none;
}

.custom-input:focus{
  border-color:var(--gold);
}

.note-input{
  margin-top:10px;
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.btn{
  border:none;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.btn-income{
  background:var(--green);
  color:white;
}

.btn-expense{
  background:var(--red);
  color:white;
}

.btn-secondary{
  background:var(--paper);
  color:var(--ink);
}

/* ================= HISTORY ================= */

.transaction{
  padding:13px 0;
  border-bottom:1px solid var(--paper-line);
}

.transaction:last-child{
  border-bottom:none;
}

.transaction-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.transaction-title{
  font-weight:bold;
}

.transaction-amount{
  font-weight:bold;
}

.transaction.in .transaction-amount{
  color:var(--green);
}

.transaction.out .transaction-amount{
  color:var(--red);
}

.transaction-note{
  font-size:13px;
  color:var(--ink-soft);
  margin-top:4px;
}

.transaction-time{
  font-size:11px;
  color:var(--ink-soft);
  margin-top:5px;
}

.delete-btn{
  border:none;
  background:var(--red-bg);
  color:var(--red);
  border-radius:8px;
  padding:6px 9px;
  margin-top:8px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:var(--ink-soft);
  padding:20px;
}

/* ================= CHART ================= */

.chart-wrap{
  overflow-x:auto;
}

canvas{
  width:100%;
  height:220px;
}

/* ================= CALCULATOR ================= */

.calc-display{
  width:100%;
  padding:18px;
  font-size:28px;
  text-align:right;
  border:1px solid var(--paper-line);
  border-radius:14px;
  background:white;
  margin-bottom:12px;
}

.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.calc-btn{
  padding:18px 5px;
  border:none;
  border-radius:12px;
  background:var(--paper);
  color:var(--ink);
  font-size:18px;
  cursor:pointer;
}

.calc-btn.operator{
  background:var(--gold);
  color:white;
}

.calc-btn.equal{
  background:var(--green);
  color:white;
}

/* ================= NOTES ================= */

.note-item{
  padding:14px 0;
  border-bottom:1px solid var(--paper-line);
}

.note-item:last-child{
  border-bottom:none;
}

.note-text{
  white-space:pre-wrap;
  margin-bottom:6px;
}

.note-time{
  font-size:11px;
  color:var(--ink-soft);
}

.note-actions{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.small-btn{
  border:none;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
}

.edit-note{
  background:#eee4c9;
  color:#80631e;
}

.delete-note{
  background:var(--red-bg);
  color:var(--red);
}

/* ================= DARK MODE ================= */

body.dark{
  --paper:#18202b;
  --paper-line:#303b4b;
  --ink:#F0F2F5;
  --ink-soft:#AAB4C3;
  --card:#222C39;
  --white:#293443;
  --green-bg:#23392D;
  --red-bg:#3B2927;
}

body.dark .custom-input,
body.dark .calc-display{
  background:#18202b;
  color:white;
}

/* ================= RESPONSIVE ================= */

@media(max-width:430px){

  main{
    padding:12px;
  }

  .balance{
    font-size:28px;
  }

  .coin-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .coin{
    padding:12px 3px;
    font-size:14px;
  }

}
</style>
</head>

<body>

<!-- ================= DRAWER ================= -->

<div id="overlay" class="overlay"></div>

<div id="drawer" class="drawer">

  <h2>📒 Buku Kas</h2>

  <button class="menu-btn" onclick="showView('home')">
    🏠 Beranda
  </button>

  <button class="menu-btn" onclick="showView('calc')">
    🧮 Kalkulator
  </button>

  <button class="menu-btn" onclick="showView('notes')">
    📝 Catatan
  </button>

  <button class="menu-btn" onclick="toggleDarkMode()">
    🌙 Mode Gelap
  </button>

</div>

<!-- ================= HEADER ================= -->

<header>

  <button id="menuBtn" class="icon-btn">
    ☰
  </button>

  <h1>DuitGW</h1>

  <button id="darkBtn" class="icon-btn">
    🌙
  </button>

</header>

<!-- ================= MAIN ================= -->

<main>

<!-- ================= HOME ================= -->

<section id="home" class="view active">

  <!-- SALDO -->

  <div class="card balance-card">

    <div class="balance-label">
      Saldo Saat Ini
    </div>

    <div id="balance" class="balance">
      Rp0
    </div>

    <div class="summary">

      <div class="summary-box income">

        <div class="summary-label">
          Pemasukan
        </div>

        <div id="totalIncome" class="summary-value">
          Rp0
        </div>

      </div>

      <div class="summary-box expense">

        <div class="summary-label">
          Pengeluaran
        </div>

        <div id="totalExpense" class="summary-value">
          Rp0
        </div>

      </div>

    </div>

  </div>


  <!-- NOMINAL -->

  <div class="card">

    <div class="card-title">
      Hitung Nominal
    </div>

    <div id="coinGrid" class="coin-grid"></div>

    <div id="tally" class="tally">
      Rp0

  <!-- GRAFIK -->

<!-- ================= CALCULATOR ================= -->

<section id="calc" class="view">

    >

      <button class="calc-btn" onclick="calcInput('7')">7</button>
      <button class="calc-btn" onclick="calcInput('8')">8</button>
      <button class="calc-btn" onclick="calcInput('9')">9</button>
      <button class="calc-btn operator" onclick="calcInput('*')">×</button>

      <button class="calc-btn" onclick="calcInput('4')">4</button>
      <button class="calc-btn" onclick="calcInput('5')">5</button>
      <button class="calc-btn" onclick="calcInput('6')">6</button>
      <button class="calc-btn operator" onclick="calcInput('-')">−</button>

      <button class="calc-btn" onclick="calcInput('1')">1</button>
      <button class="calc-btn" onclick="calcInput('2')">2</button>
      <button class="calc-btn" onclick="calcInput('3')">3</button>

<!-- ================= NOTES ================= -->

<section id="notes" class="view">

      rows="5"
      placeholder="Tulis catatan..."
    ></textarea>

    <button
      id="noteAdd"
      class="btn btn-income"
      style="width:100%;margin-top:10px;">
      Simpan catatan
    </button>

  </div>


  <div class="card">

    <div class="card-title">
      Daftar Catatan
    </div>

    <div id="notesList"></div>

  </div>

</section>

</main>


<script>

/* =====================================================
   PENYIMPANAN DATA
===================================================== */

var DATA_KEY = 'buku-kas-harian:data:v3';
var NOTES_KEY = 'buku-kas-harian:notes:v3';


var data = {
  transactions: []
};

var notes = [];

var tally = 0;

var editId = null;


/* =====================================================
   NOMINAL
   1K = Rp1.000
   2K = Rp2.000
   dst.
===================================================== */

var DENOMS = [
  1,
  2,
  5,
  10,
  20,
  50,
  100
];


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function rupiah(value){

  value = Number(value) || 0;

  return 'Rp' + value.toLocaleString('id-ID');

}


/* =====================================================
   LOAD DATA
===================================================== */

function loadData(){

  try{

    var saved =
      localStorage.getItem(DATA_KEY);

    if(saved){

      var parsed =
        JSON.parse(saved);

      if(parsed &&
         Array.isArray(parsed.transactions)){

        data = parsed;

      }

    }

  }catch(e){

    data = {
      transactions:[]
    };

  }


  try{

    var savedNotes =
      localStorage.getItem(NOTES_KEY);

    if(savedNotes){

      var parsedNotes =
        JSON.parse(savedNotes);

      if(Array.isArray(parsedNotes)){

        notes = parsedNotes;

      }

    }

  }catch(e){

    notes = [];

  }

}


/* =====================================================
   SAVE DATA
===================================================== */

function saveData(){

  localStorage.setItem(
    DATA_KEY,
    JSON.stringify(data)
  );

}


function saveNotes(){

  localStorage.setItem(
    NOTES_KEY,
    JSON.stringify(notes)
  );

}


/* =====================================================
   HITUNG TOTAL
===================================================== */

function getTotals(){

  var income = 0;
  var expense = 0;

  data.transactions.forEach(function(t){

    if(t.type === 'income'){

      income += Number(t.amount);

    }else{

      expense += Number(t.amount);

    }

  });

  return {
    income:income,
    expense:expense,
    balance:income-expense
  };

}


/* =====================================================
   RENDER SALDO
===================================================== */

function renderBalance(){

  var totals = getTotals();

  document.getElementById('balance').textContent =
    rupiah(totals.balance);

  document.getElementById('totalIncome').textContent =
    rupiah(totals.income);

  document.getElementById('totalExpense').textContent =
    rupiah(totals.expense);

}


/* =====================================================
   RENDER NOMINAL
===================================================== */

function renderTally(){

  document.getElementById('tally').textContent =
    rupiah(tally);

}


/* =====================================================
   TAMBAH TRANSAKSI
===================================================== */

function addTransaction(type){

  var amount = Number(tally);

  if(!amount || amount <= 0){

    showMsg(
      'Masukkan nominal terlebih dahulu.',
      'red'
    );

    return;

  }


  var note =
    document.getElementById(
      'transactionNote'
    ).value.trim();


  var now = new Date();


  data.transactions.unshift({

    id:
      Date.now() +
      '-' +
      Math.random()
        .toString(36)
        .slice(2,7),

    type:type,

    amount:amount,

    note:note,

    time:now.toLocaleString(
      'id-ID',
      {
        day:'numeric',
        month:'short',
        year:'numeric',
        hour:'2-digit',
        minute:'2-digit'
      }
    )

  });


  saveData();

  tally = 0;

  document.getElementById(
    'customAmount'
  ).value = '';

  document.getElementById(
    'transactionNote'
  ).value = '';


  renderAll();

  showMsg(
    type === 'income'
      ? 'Pemasukan berhasil ditambahkan.'
      : 'Pengeluaran berhasil ditambahkan.',
    'green'
  );

}


/* =====================================================
   HAPUS TRANSAKSI
===================================================== */

function deleteTransaction(id){

  data.transactions =
    data.transactions.filter(
      function(t){
        return t.id !== id;
      }
    );

  saveData();

  renderAll();

}


/* =====================================================
   RENDER TRANSAKSI
===================================================== */

function renderTransactions(){

  var container =
    document.getElementById(
      'transactions'
    );

  container.innerHTML = '';


  if(data.transactions.length === 0){

    container.innerHTML =
      '<div class="empty">' +
      'Belum ada transaksi.' +
      '</div>';

    return;

  }


  data.transactions.forEach(
    function(t){

      var div =
        document.createElement('div');

      div.className =
        'transaction ' +
        (t.type === 'income'
          ? 'in'
          : 'out');


      var sign =
        t.type === 'income'
          ? '+'
          : '-';


      var title =
        t.type === 'income'
          ? 'Pemasukan'
          : 'Pengeluaran';


      div.innerHTML =

        '<div class="transaction-top">' +

          '<div class="transaction-title">' +
            title +
          '</div>' +

          '<div class="transaction-amount">' +
            sign + rupiah(t.amount) +
          '</div>' +

        '</div>' +

        (
          t.note
            ? '<div class="transaction-note">' +
                escapeHTML(t.note) +
              '</div>'
            : ''
        ) +

        '<div class="transaction-time">' +
          escapeHTML(t.time) +
        '</div>' +

        '<button class="delete-btn">' +
          'Hapus' +
        '</button>';


      div.querySelector(
        '.delete-btn'
      ).addEventListener(
        'click',
        function(){

          deleteTransaction(t.id);

        }
      );


      container.appendChild(div);

    }
  );

}


/* =====================================================
   GRAFIK
===================================================== */

function drawChart(){

  var canvas =
    document.getElementById('chart');

  var ctx =
    canvas.getContext('2d');


  var width =
    canvas.clientWidth;

  var height = 220;


  var ratio =
    window.devicePixelRatio || 1;


  canvas.width =
    width * ratio;

  canvas.height =
    height * ratio;


  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  var totals =
    getTotals();


  var max =
    Math.max(
      totals.income,
      totals.expense,
      1000
    );


  var barWidth =
    Math.min(
      90,
      width / 4
    );


  var incomeHeight =
    (totals.income / max) *
    150;


  var expenseHeight =
    (totals.expense / max) *
    150;


  var center =
    width / 2;


  /* garis dasar */

  ctx.strokeStyle =
    getComputedStyle(
      document.body
    ).getPropertyValue(
      '--paper-line'
    );

  ctx.beginPath();

  ctx.moveTo(
    20,
    180
  );

  ctx.lineTo(
    width - 20,
    180
  );

  ctx.stroke();


  /* pemasukan */

  ctx.fillStyle =
    '#3C7A5B';

  ctx.fillRect(
    center - barWidth - 10,
    180 - incomeHeight,
    barWidth,
    incomeHeight
  );


  /* pengeluaran */

  ctx.fillStyle =
    '#A6483A';

  ctx.fillRect(
    center + 10,
    180 - expenseHeight,
    barWidth,
    expenseHeight
  );


  ctx.fillStyle =
    getComputedStyle(
      document.body
    ).getPropertyValue(
      '--ink'
    );

  ctx.textAlign =
    'center';

  ctx.font =
    '12px Arial';


  ctx.fillText(
    'Pemasukan',
    center - barWidth / 2 - 10,
    205
  );


  ctx.fillText(
    'Pengeluaran',
    center + barWidth / 2 + 10,
    205
  );


  ctx.font =
    'bold 12px Arial';


  ctx.fillText(
    rupiah(totals.income),
    center - barWidth / 2 - 10,
    Math.max(
      15,
      175 - incomeHeight
    )
  );


  ctx.fillText(
    rupiah(totals.expense),
    center + barWidth / 2 + 10,
    Math.max(
      15,
      175 - expenseHeight
    )
  );

}


/* =====================================================
   PESAN
===================================================== */

function showMsg(
  text,
  color
){

  var el =
    document.getElementById(
      'message'
    );

  el.textContent = text;


  if(color === 'red'){

    el.style.color =
      '#A6483A';

  }else{

    el.style.color =
      '#3C7A5B';

  }


  if(text){

    setTimeout(
      function(){

        el.textContent = '';

      },
      2500
    );

  }

}


/* =====================================================
   CATATAN
===================================================== */

function renderNotes(){

  var list =
    document.getElementById(
      'notesList'
    );

  list.innerHTML = '';


  if(notes.length === 0){

    list.innerHTML =
      '<div class="empty">' +
      'Belum ada catatan.' +
      '</div>';

    return;

  }


  notes.forEach(
    function(n){

      var div =
        document.createElement(
          'div'
        );

      div.className =
        'note-item';


      div.innerHTML =

        '<div class="note-text">' +
          escapeHTML(n.text) +
        '</div>' +

        '<div class="note-time">' +
          escapeHTML(n.timeDisplay) +
        '</div>' +

        '<div class="note-actions">' +

          '<button class="small-btn edit-note">' +
            'Edit' +
          '</button>' +

          '<button class="small-btn delete-note">' +
            'Hapus' +
          '</button>' +

        '</div>';


      div.querySelector(
        '.edit-note'
      ).addEventListener(
        'click',
        function(){

          document.getElementById(
            'noteText'
          ).value = n.text;


          editId = n.id;


          document.getElementById(
            'noteAdd'
          ).textContent =
            'Simpan perubahan';


          document.getElementById(
            'noteText'
          ).focus();

        }
      );


      div.querySelector(
        '.delete-note'
      ).addEventListener(
        'click',
        function(){

          notes =
            notes.filter(
              function(item){

                return item.id !== n.id;

              }
            );


          if(editId === n.id){

            editId = null;

            document.getElementById(
              'noteText'
            ).value = '';

            document.getElementById(
              'noteAdd'
            ).textContent =
              'Simpan catatan';

          }


          saveNotes();

          renderNotes();

        }
      );


      list.appendChild(div);

    }
  );

}


/* =====================================================
   TAMBAH / EDIT CATATAN
===================================================== */

function addNote(){

  var textarea =
    document.getElementById(
      'noteText'
    );


  var text =
    textarea.value.trim();


  if(!text){

    return;

  }


  var now =
    new Date();


  if(editId !== null){

    notes.forEach(
      function(n){

        if(n.id === editId){

          n.text = text;

          n.timeDisplay =
            now.toLocaleString(
              'id-ID',
              {
                day:'numeric',
                month:'short',
                year:'numeric',
                hour:'2-digit',
                minute:'2-digit'
              }
            );

        }

      }
    );


    editId = null;


    document.getElementById(
      'noteAdd'
    ).textContent =
      'Simpan catatan';


  }else{

    notes.unshift({

      id:
        Date.now() +
        '-' +
        Math.random()
          .toString(36)
          .slice(2,6),

      text:text,

      timeDisplay:
        now.toLocaleString(
          'id-ID',
          {
            day:'numeric',
            month:'short',
            year:'numeric',
            hour:'2-digit',
            minute:'2-digit'
          }
        )

    });

  }


  saveNotes();


  textarea.value = '';


  renderNotes();

}


/* =====================================================
   CUSTOM NOMINAL
===================================================== */

function addCustomAmount(){

  var input =
    document.getElementById(
      'customAmount'
    );


  var amount =
    Number(input.value);


  if(!amount || amount <= 0){

    return;

  }


  tally += amount;


  input.value = '';


  renderTally();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =====================================================
   VIEW / MENU
===================================================== */

function showView(id){

  document
    .querySelectorAll('.view')
    .forEach(
      function(view){

        view.classList.remove(
          'active'
        );

      }
    );


  document
    .getElementById(id)
    .classList.add(
      'active'
    );


  closeDrawer();


  if(id === 'home'){

    setTimeout(
      drawChart,
      50
    );

  }

}


/* =====================================================
   DRAWER
===================================================== */

function openDrawer(){

  document
    .getElementById('drawer')
    .classList.add('open');


  document
    .getElementById('overlay')
    .classList.add('show');

}


function closeDrawer(){

  document
    .getElementById('drawer')
    .classList.remove('open');


  document
    .getElementById('overlay')
    .classList.remove('show');

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDarkMode(){

  document.body.classList.toggle(
    'dark'
  );


  localStorage.setItem(
    'buku-kas-dark',
    document.body.classList.contains(
      'dark'
    )
      ? '1'
      : '0'
  );


  setTimeout(
    drawChart,
    50
  );

}


/* =====================================================
   CALCULATOR
===================================================== */

function calcInput(value){

  var display =
    document.getElementById(
      'calcDisplay'
    );


  display.value += value;

}


function calcClear(){

  document.getElementById(
    'calcDisplay'
  ).value = '';

}


function calcBack(){

  var display =
    document.getElementById(
      'calcDisplay'
    );


  display.value =
    display.value.slice(
      0,
      -1
    );

}


function calcResult(){

  var display =
    document.getElementById(
      'calcDisplay'
    );


  var expression =
    display.value;


  if(!expression){

    return;

  }


  /* Hanya izinkan angka dan operator */

  if(!/^[0-9+\-*/().\s]+$/.test(expression)){

    display.value = 'Error';

    return;

  }


  try{

    var result =
      Function(
        '"use strict";return (' +
        expression +
        ')'
      )();


    if(
      typeof result !== 'number' ||
      !isFinite(result)
    ){

      throw new Error();

    }


    display.value =
      String(result);

  }catch(e){

    display.value =
      'Error';

  }

}


/* =====================================================
   RENDER SEMUA
===================================================== */

function renderAll(){

  renderBalance();

  renderTally();

  renderTransactions();

  renderNotes();

  drawChart();

}


/* =====================================================
   INIT
===================================================== */

function init(){

  loadData();


  /* =============================
     BUAT TOMBOL NOMINAL
  ============================= */

  var coinGrid =
    document.getElementById(
      'coinGrid'
    );


  DENOMS.forEach(
    function(d){

      var button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.className =
        'coin';


      /*
        TAMPILAN:
        1K
        2K
        5K
        10K
        20K
        50K
        100K
      */

      button.textContent =
        d + 'K';


      button.addEventListener(
        'click',
        function(){

          /*
            1K = Rp1.000
            2K = Rp2.000
            dst.
          */

          tally +=
            d * 1000;


          showMsg('');

          renderTally();

        }
      );


      coinGrid.appendChild(
        button
      );

    }
  );


  /* =============================
     TOMBOL TRANSAKSI
  ============================= */

  document
    .getElementById(
      'incomeBtn'
    )
    .addEventListener(
      'click',
      function(){

        addTransaction(
          'income'
        );

      }
    );


  document
    .getElementById(
      'expenseBtn'
    )
    .addEventListener(
      'click',
      function(){

        addTransaction(
          'expense'
        );

      }
    );


  /* =============================
     CUSTOM NOMINAL
  ============================= */

  document
    .getElementById(
      'customAmount'
    )
    .addEventListener(
      'change',
      addCustomAmount
    );


  /* =============================
     RESET
  ============================= */

  document
    .getElementById(
      'resetTally'
    )
    .addEventListener(
      'click',
      function(){

        tally = 0;

        document.getElementById(
          'customAmount'
        ).value = '';

        renderTally();

      }
    );


  /* =============================
     CATATAN
  ============================= */

  document
    .getElementById(
      'noteAdd'
    )
    .addEventListener(
      'click',
      addNote
    );


  /* =============================
     MENU
  ============================= */

  document
    .getElementById(
      'menuBtn'
    )
    .addEventListener(
      'click',
      openDrawer
    );


  document
    .getElementById(
      'overlay'
    )
    .addEventListener(
      'click',
      closeDrawer
    );


  /* =============================
     DARK MODE
  ============================= */

  document
    .getElementById(
      'darkBtn'
    )
    .addEventListener(
      'click',
      toggleDarkMode
    );


  if(
    localStorage.getItem(
      'buku-kas-dark'
    ) === '1'
  ){

    document.body.classList.add(
      'dark'
    );

  }


  renderAll();


  window.addEventListener(
    'resize',
    drawChart
  );

}


/* =====================================================
   JALANKAN PROGRAM
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  init
);

</script>

</html>
